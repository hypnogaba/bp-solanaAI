# Deploys worker/ to Cloudflare on every push to main that touches it.
# One-time setup: repo Settings -> Secrets and variables -> Actions -> New repository secret
#   CLOUDFLARE_API_TOKEN   (Cloudflare dashboard -> My Profile -> API Tokens -> "Edit Cloudflare Workers" template)
# Optional, for POST /admin/season: npx wrangler secret put ADMIN_KEY (once, from the Mac).
name: deploy worker
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsc -p .
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
